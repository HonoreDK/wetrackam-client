name: iOS Build (non signé, pour sideload)

# Déclenchement manuel uniquement : les runners macOS consomment les minutes
# GitHub Actions ~10x plus vite que les runners Linux (ci.yml/analyze.yml).
# Lancer depuis l'onglet Actions > iOS Build (non signé, pour sideload) >
# Run workflow, quand une IPA à sideloader est réellement nécessaire.
on:
  workflow_dispatch:

jobs:
  build_ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
          channel: 'stable'

      - run: flutter pub get

      # Le projet Xcode référence ios/Runner/GoogleService-Info.plist comme
      # entrée de build (étape "Copy Bundle Resources"), mais ce fichier
      # n'a jamais été ajouté au dépôt : Firebase/FCM n'est pas configuré
      # côté iOS (seul android/app/google-services.json l'est, voir
      # firebase.json). Sans ce fichier, Xcode refuse de compiler, même si
      # Firebase.initializeApp() échoue déjà proprement à l'exécution
      # (try/catch, voir push_notifications_service.dart). Ce placeholder
      # satisfait uniquement l'étape de build ; les notifications push ne
      # fonctionneront pas sur cette installation (voir
      # WETRACKAM-CLIENT-IOS-SIDELOAD.md §5).
      - name: Créer un GoogleService-Info.plist placeholder (build only, FCM non fonctionnel)
        run: |
          cat > ios/Runner/GoogleService-Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>CLIENT_ID</key>
          	<string>placeholder</string>
          	<key>REVERSED_CLIENT_ID</key>
          	<string>placeholder</string>
          	<key>API_KEY</key>
          	<string>placeholder</string>
          	<key>GCM_SENDER_ID</key>
          	<string>000000000000</string>
          	<key>PLIST_VERSION</key>
          	<string>1</string>
          	<key>BUNDLE_ID</key>
          	<string>cm.wetrackam.driver</string>
          	<key>PROJECT_ID</key>
          	<string>wetrackam-client-placeholder</string>
          	<key>STORAGE_BUCKET</key>
          	<string>wetrackam-client-placeholder.appspot.com</string>
          	<key>IS_ADS_ENABLED</key>
          	<false/>
          	<key>IS_ANALYTICS_ENABLED</key>
          	<false/>
          	<key>IS_APPINVITE_ENABLED</key>
          	<false/>
          	<key>IS_GCM_ENABLED</key>
          	<true/>
          	<key>IS_SIGNIN_ENABLED</key>
          	<false/>
          	<key>GOOGLE_APP_ID</key>
          	<string>1:000000000000:ios:0000000000000000000000</string>
          </dict>
          </plist>
          EOF

      - name: Installer les pods iOS
        run: cd ios && pod install

      # Pas de compte Apple Developer en CI : build sans signature. L'IPA
      # obtenue est signée ensuite localement par Sideloadly/AltStore, avec
      # un identifiant Apple gratuit, au moment de l'installation sur
      # l'iPhone (cf. WETRACKAM-CLIENT-IOS-SIDELOAD.md).
      - name: Compiler sans signature
        run: flutter build ios --release --no-codesign

      - name: Empaqueter en IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r ../WeTrackam.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: wetrackam-ios-unsigned
          path: build/ios/WeTrackam.ipa
          retention-days: 14
