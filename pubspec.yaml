name: wetrackam_client
description: "Application chauffeur WeTrackam"
publish_to: 'none'
version: 17.0.0+170

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_background_geolocation: ^5.0.3
  shared_preferences: ^2.5.4
  google_fonts: ^6.2.1
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  # v13 : borne relevee — flutter_map 8.3.1 exige http ^1.5.0.
  http: ^1.5.0
  quick_actions: ^1.1.0
  rate_my_app: ^2.3.2
  shared_preferences_android: ^2.4.20
  wakelock_partial_android: ^1.0.1
  mobile_scanner: ^7.2.0
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  uuid: ^4.5.1
  flutter_secure_storage: ^10.0.0
  app_links: ^7.2.1
  app_settings: ^7.0.0
  # Lot 4 (contrat v5 §7.5/§8) : FCM v1 réintroduit — le contrat v4 exigeait
  # le retrait de Firebase, le v5 l'exige de nouveau spécifiquement pour le
  # push. Voir RAPPORT_LIVRAISON_V4.md pour l'historique du retrait initial.
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.6
  crypto: ^3.0.6
  cryptography: ^2.7.0
  # Lot 6 — WebSocket temps réel (service distinct de Traccar, §2 v5)
  web_socket_channel: ^3.0.1
  # Lot 7 — notes vocales : enregistrement + lecture (upload/téléchargement
  # via URL signée, jamais par la socket — voir voice_note_service.dart)
  record: ^6.2.1
  just_audio: ^0.9.42
  # Lot 8 — appels WebRTC. ⚠️ Version à reconfirmer au `flutter pub get` :
  # aucune compilation possible dans cet environnement pour la vérifier.
  flutter_webrtc: ^1.5.2
  # v13 — carte réelle des collègues (OpenStreetMap, aucune clé API requise,
  # aucune configuration native : tuiles servies en HTTPS par le réseau OSM).
  flutter_map: ^8.3.1
  latlong2: ^0.9.1
  # v13 — bascule réseau (Wi-Fi <-> données mobiles) : déclenche un ICE
  # restart au lieu de laisser l'appel mourir en silence (règle 6 du §12).
  connectivity_plus: ^7.3.1
  # v13 — appel entrant application en arrière-plan OU tuée : écran d'appel
  # plein écran natif (CallKit sur iOS, notification full-screen sur Android).
  flutter_callkit_incoming: ^3.1.5


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/
